name: Daily Keyword News

on:
  schedule:
    - cron: "7 22 * * *"   # 매일 07:07 KST (UTC 22:07)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
    inputs:
      mode:
        description: "publish=바로 게시 / preview=내 메일로 미리보기 / publish_saved=미리보기 글 그대로 게시"
        type: choice
        options: [publish, preview, publish_saved]
        default: publish
      run_id:
        description: "publish_saved 일 때만: 미리보기 실행 번호(Run ID)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # 60일 비활동 자동 중지 방지용
  id-token: write  # Claude Code Action 인증용

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download saved preview
        if: ${{ inputs.mode == 'publish_saved' }}
        uses: actions/download-artifact@v4
        with:
          name: output
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      # 1) 구독 방식: 뉴스 수집 → 작업 지시서 작성
      - name: Prepare (subscription)
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && inputs.mode != 'publish_saved' }}
        run: python scripts/post_daily_news.py
        env:
          MODE: prepare
      - name: Clean subscription token
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && inputs.mode != 'publish_saved' }}
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d ' \r\n\t')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_OAUTH=$CLEAN" >> "$GITHUB_ENV"
      # 2) 구독 방식: Claude Code(Pro 구독)가 글 작성 + 팩트체크 → work/mag.json
      - name: Write with Claude subscription
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && inputs.mode != 'publish_saved' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ github.token }}
          prompt: |
            work/task.md 파일을 읽고 그 지시를 정확히 따르세요.
            최종 결과는 work/mag.json 파일 하나로만 저장하고, 다른 파일은 수정하지 마세요.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Write"
      # 3) 게시 (구독 결과가 없으면 API로 작성)
      - run: python scripts/post_daily_news.py
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save generated post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output.html
            title.txt
          if-no-files-found: ignore
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-news.yml --repo "$GITHUB_REPOSITORY" || true
