name: Daily Keyword News

on:
  schedule:
    - cron: "7 22 * * *"   # 매일 07:07 KST (UTC 22:07)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
    inputs:
      mode:
        description: "publish=바로 게시 / preview=내 메일로 미리보기 / publish_saved=미리보기 글 그대로 게시"
        type: choice
        options: [publish, preview, publish_saved]
        default: publish
      run_id:
        description: "publish_saved 일 때만: 미리보기 실행 번호(Run ID)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # 60일 비활동 자동 중지 방지용

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download saved preview
        if: ${{ inputs.mode == 'publish_saved' }}
        uses: actions/download-artifact@v4
        with:
          name: output
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/post_daily_news.py
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save generated post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output.html
            title.txt
          if-no-files-found: ignore
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-news.yml --repo "$GITHUB_REPOSITORY" || true
