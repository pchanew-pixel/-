name: Check Claude Subscription

on:
  workflow_dispatch:
    inputs:
      model:
        description: "모델 (비우면 Claude Code 기본값)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clean subscription token
        if: ${{ true }}
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d ' \r\n\t')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_OAUTH=$CLEAN" >> "$GITHUB_ENV"
      - name: Tiny test with subscription
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: "Reply with the single word OK."
          claude_args: |
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            --max-turns 1
